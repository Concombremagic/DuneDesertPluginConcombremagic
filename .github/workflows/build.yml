name: Build DuneDesert Plugin

on:
  push:
    branches:
      - main
      - ver-de-la-mort
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Télécharger le code
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Compiler le plugin
        uses: gradle/actions/setup-gradle@v4

      - name: Construire le JAR
        run: gradle build

      - name: Récupérer le JAR
        uses: actions/upload-artifact@v4
        with:
          name: DuneDesert
          path: build/libs/*.jar

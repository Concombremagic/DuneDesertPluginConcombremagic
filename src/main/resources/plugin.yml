
name: DuneDesert
version: 1.0.0
main: fr.dunedunes.DuneDesertPlugin
api-version: '26.3'
load: STARTUP
description: Générateur de monde désertique à grandes dunes.

commands:
  dunes:
    description: Crée ou rejoint un monde de grandes dunes.
    usage: /dunes <create|tp> <nom>
    permission: dunedesert.admin

permissions:
  dunedesert.admin:
    description: Autorise la création et l'accès aux mondes DuneDesert.
    default: op

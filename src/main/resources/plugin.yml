
name: DuneDesert
version: 1.0.0
main: fr.dunedunes.DuneDesertPlugin
api-version: '26.3'
load: STARTUP
description: Générateur de monde désertique à grandes dunes et mini-boss Ver de la Mort.

commands:
  dunes:
    description: Crée ou rejoint un monde de grandes dunes.
    usage: /dunes <create|tp> <nom>
    permission: dunedesert.admin

  verdelamort:
    description: Donne l'œuf du Ver de la Mort.
    usage: /verdelamort give
    permission: dunedesert.admin

permissions:
  dunedesert.admin:
    description: Autorise l'administration de DuneDesert et du Ver de la Mort.
    default: op
